<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Verdict – Neha vs Anurag</title>
<meta name="theme-color" content="#fde2e4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script>
  /* ✏️ Keep these the same as in index.html */
  const CONFIG = {
    PARENT_A: { name: "Neha",   emoji: "🤰", color: "#ff8fab" },
    PARENT_B: { name: "Anurag", emoji: "🧔", color: "#6ec6ff" },
    SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyS4ONxVTR4kDJ_51Rgb5DWCy_DJoFBsZ93fKcWZrjsij9SxSgfVTxGB248jwjzFfPSZA/exec",
    REFRESH_SECONDS: 30,
  };
</script>
<style>
:root{--pink:#ff8fab;--blue:#6ec6ff;--yellow:#ffd166;--mint:#9be7c4;--ink:#4a3b52;--soft:#7d6b86}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(160deg,#fde2e4 0%,#fff1e6 40%,#e2ece9 75%,#dfe7fd 100%);background-attachment:fixed}
h1,h2,h3,.baloo{font-family:'Baloo 2',cursive}
.floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaters span{position:absolute;bottom:-60px;opacity:.45;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(25deg)}}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 18px 60px}

/* header */
header{text-align:center;margin-bottom:22px}
header small{letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--soft);font-size:12px}
header h1{font-size:clamp(36px,7vw,60px);line-height:1;margin:6px 0;
  background:linear-gradient(90deg,var(--pink),#c77dff,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{color:var(--soft);font-size:14px}
.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{font-family:'Baloo 2';font-weight:700;font-size:17px;border:none;border-radius:16px;padding:10px 20px;cursor:pointer;color:#fff;
  background:linear-gradient(90deg,var(--pink),#c77dff);box-shadow:0 8px 20px #c77dff40}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 12px #0001}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;background:#ffffffd9;border:2px solid #fff;border-radius:30px;padding:22px;box-shadow:0 12px 40px #b47e9a22;margin-bottom:18px}
.side{text-align:center}
.side .av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:46px;margin:0 auto 6px;border:4px solid #fff;box-shadow:0 6px 16px #0001}
.side .nm{font-family:'Baloo 2';font-weight:800;font-size:24px}
.side .big{font-family:'Baloo 2';font-weight:800;font-size:44px;line-height:1}
.side .sub{font-size:13px;color:var(--soft);font-weight:700}
.side.win .av{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.crown{font-size:26px;display:block;height:30px}
.vs{font-family:'Baloo 2';font-weight:800;color:var(--soft);font-size:20px;background:#fff;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 12px #0001}
.overall{height:16px;border-radius:99px;overflow:hidden;display:flex;margin-top:4px;grid-column:1/-1;background:#fff}
.overall i{display:block;transition:width .8s ease}

/* question grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.q{background:#ffffffd9;border:2px solid #fff;border-radius:24px;padding:18px;box-shadow:0 8px 24px #0000000d;cursor:pointer;transition:transform .15s}
.q:hover{transform:translateY(-3px)}
.q .top{display:flex;gap:10px;align-items:flex-start}
.q .num{font-family:'Baloo 2';font-weight:800;font-size:13px;background:var(--yellow);padding:2px 10px;border-radius:99px;flex-shrink:0;margin-top:3px}
.q h3{font-size:19px;line-height:1.2;flex:1}
.q .e{font-size:28px}
.split{display:flex;height:34px;border-radius:12px;overflow:hidden;margin:14px 0 8px;background:#f3eef2}
.split div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;transition:width .8s ease;white-space:nowrap;overflow:hidden}
.legend{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--soft)}
.badge{display:inline-block;margin-top:10px;font-family:'Baloo 2';font-weight:700;font-size:15px;padding:3px 12px;border-radius:99px;color:#fff}
.voters{display:none;margin-top:12px;font-size:13px;line-height:1.5;border-top:1px dashed #e6d6de;padding-top:10px}
.q.open .voters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.voters b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.tap{font-size:12px;color:var(--soft);margin-top:8px}

/* guests */
.guests{margin-top:22px;background:#ffffffd9;border:2px solid #fff;border-radius:24px;padding:18px}
.guests h2{font-size:22px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1.5px solid #ecd7e1;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
.chip span{color:var(--soft);font-weight:400}

.state{text-align:center;padding:60px 20px;color:var(--soft);font-size:18px}
.spinner{width:50px;height:50px;border:6px solid #fff;border-top-color:var(--pink);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Presentation mode ---------- */
#show{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:4vh 5vw;
  background:linear-gradient(160deg,#fde2e4 0%,#fff1e6 40%,#e2ece9 75%,#dfe7fd 100%);text-align:center;cursor:pointer;user-select:none}
#show.on{display:flex}
#show .count{position:absolute;top:3vh;left:0;right:0;font-weight:800;color:var(--soft);letter-spacing:2px;font-size:clamp(12px,1.6vw,18px)}
#show .close{position:absolute;top:2vh;right:2vw;background:#fff;border:none;border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:0 4px 12px #0001}
#show .se{font-size:clamp(60px,10vw,130px);line-height:1}
#show .sq{font-family:'Baloo 2';font-weight:800;font-size:clamp(30px,5.2vw,72px);line-height:1.1;max-width:1100px;margin:2vh 0 5vh}
.duel{display:flex;gap:4vw;align-items:flex-end;justify-content:center;width:100%;max-width:1000px}
.pl{flex:1;display:flex;flex-direction:column;align-items:center}
.pl .pav{width:clamp(90px,13vw,170px);height:clamp(90px,13vw,170px);border-radius:50%;display:grid;place-items:center;font-size:clamp(50px,7vw,95px);border:6px solid #fff;box-shadow:0 10px 30px #0001;transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.pl .pnm{font-family:'Baloo 2';font-weight:800;font-size:clamp(24px,3.4vw,44px);margin-top:1vh}
.pl .pct{font-family:'Baloo 2';font-weight:800;font-size:clamp(40px,6vw,84px);line-height:1;opacity:0;transform:scale(.5);transition:all .5s cubic-bezier(.2,1.6,.4,1)}
.pl .pv{font-weight:700;color:var(--soft);font-size:clamp(13px,1.5vw,18px);opacity:0;transition:opacity .4s .2s}
.pl .pbar{width:100%;height:clamp(14px,2vh,22px);background:#fff;border-radius:99px;overflow:hidden;margin-top:1.5vh}
.pl .pbar i{display:block;height:100%;width:0;transition:width 1.1s ease}
.revealed .pct,.revealed .pv{opacity:1;transform:none}
.revealed .pl.winner .pav{transform:scale(1.15) rotate(-4deg)}
.pl .pcrown{font-size:clamp(36px,5vw,64px);height:clamp(44px,6vw,74px);opacity:0;transform:translateY(20px);transition:all .5s .9s}
.revealed .pl.winner .pcrown{opacity:1;transform:none}
#show .hint{position:absolute;bottom:3vh;color:var(--soft);font-size:clamp(12px,1.4vw,16px);font-weight:600}
#show .final h2{font-size:clamp(40px,7vw,90px);line-height:1}
.confetti{position:fixed;top:-30px;z-index:60;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="floaters" id="floaters"></div>
<div class="wrap">
  <header>
    <small>Baby Shower Results</small>
    <h1>The Verdict Is In!</h1>
    <p class="meta" id="meta">Loading…</p>
    <div class="toolbar">
      <button class="btn" id="presentBtn">▶ Present on TV</button>
      <button class="btn ghost" id="refreshBtn">↻ Refresh</button>
    </div>
  </header>
  <div id="content"><div class="state"><div class="spinner"></div>Fetching predictions…</div></div>
</div>

<div id="show">
  <button class="close" id="closeShow" aria-label="Close">✕</button>
  <div class="count" id="sCount"></div>
  <div id="stage"></div>
  <div class="hint" id="sHint">Tap / press → to reveal</div>
</div>

<script>
const A=CONFIG.PARENT_A,B=CONFIG.PARENT_B,$=id=>document.getElementById(id);
const EMOJI=["📸","🧷","🤹","😴","🤧","🌿","☝️","☕","🧸","🎶","🧿","👮","🌙"];
let DATA=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// floating bits
["🍼","🧸","⭐","☁️","🎈","💗","💙","🐣","🌙","🍼","🧸","⭐"].forEach((b,i)=>{const s=document.createElement("span");s.textContent=b;
  s.style.left=Math.random()*100+"vw";s.style.animationDuration=(16+Math.random()*16)+"s";s.style.animationDelay=(-Math.random()*25)+"s";
  s.style.fontSize=(18+Math.random()*20)+"px";$("floaters").appendChild(s);});

async function load(){
  try{
    let json;
    if(new URLSearchParams(location.search).has("demo")) json=demoData();
    else{ const r=await fetch(CONFIG.SCRIPT_URL+"?t="+Date.now()); json=await r.json(); }
    DATA=crunch(json); render();
  }catch(e){
    console.error(e);
    if(!DATA) $("content").innerHTML=`<div class="state">😅 Couldn't load results.<br><small>Check that the Apps Script was redeployed with the new code (see README).</small></div>`;
  }
}

function crunch({headers,rows}){
  const qh=(headers||[]).filter(h=>/^Q\d+\./.test(h));
  const qs=qh.map((h,i)=>{
    const a=[],b=[];
    rows.forEach(r=>{const v=String(r[h]||"").trim(); if(v===A.name)a.push(r.name); else if(v===B.name)b.push(r.name);});
    return {h,text:h.replace(/^Q\d+\.\s*/,""),emoji:EMOJI[i]||"❓",a,b};
  });
  const totA=qs.reduce((s,q)=>s+q.a.length,0), totB=qs.reduce((s,q)=>s+q.b.length,0);
  const winsA=qs.filter(q=>q.a.length>q.b.length).length, winsB=qs.filter(q=>q.b.length>q.a.length).length;
  return {qs,rows,totA,totB,winsA,winsB};
}

function pct(n,t){return t?Math.round(n/t*100):0}

function render(){
  const d=DATA, n=d.rows.length;
  $("meta").textContent = n ? `${n} guest${n>1?"s":""} voted · updated ${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}` : "No responses yet";
  if(!n){$("content").innerHTML=`<div class="state">🍼 No predictions yet — share the quiz link and check back!</div>`;return;}
  const lead = d.winsA===d.winsB?null:(d.winsA>d.winsB?"A":"B");
  const tot=d.totA+d.totB;
  let html=`<section class="score">
    <div class="side ${lead==="A"?"win":""}"><span class="crown">${lead==="A"?"👑":""}</span>
      <div class="av" style="background:${A.color}33">${A.emoji}</div><div class="nm">${esc(A.name)}</div>
      <div class="big" style="color:${A.color}">${d.winsA}</div><div class="sub">questions won · ${pct(d.totA,tot)}% of votes</div></div>
    <div class="vs">VS</div>
    <div class="side ${lead==="B"?"win":""}"><span class="crown">${lead==="B"?"👑":""}</span>
      <div class="av" style="background:${B.color}33">${B.emoji}</div><div class="nm">${esc(B.name)}</div>
      <div class="big" style="color:${B.color}">${d.winsB}</div><div class="sub">questions won · ${pct(d.totB,tot)}% of votes</div></div>
    <div class="overall"><i style="width:${pct(d.totA,tot)}%;background:${A.color}"></i><i style="width:${100-pct(d.totA,tot)}%;background:${B.color}"></i></div>
  </section><section class="grid">`;
  d.qs.forEach((q,i)=>{
    const t=q.a.length+q.b.length, pa=pct(q.a.length,t), pb=t?100-pa:0;
    const w=q.a.length>q.b.length?A:q.b.length>q.a.length?B:null;
    html+=`<article class="q" data-i="${i}">
      <div class="top"><span class="num">Q${i+1}</span><h3>${esc(q.text)}</h3><span class="e">${q.emoji}</span></div>
      <div class="split"><div style="width:${pa}%;background:${A.color}">${pa>=12?pa+"%":""}</div><div style="width:${pb}%;background:${B.color}">${pb>=12?pb+"%":""}</div></div>
      <div class="legend"><span>${A.emoji} ${esc(A.name)} · ${q.a.length}</span><span>${q.b.length} · ${esc(B.name)} ${B.emoji}</span></div>
      ${w?`<span class="badge" style="background:${w.color}">${w.emoji} ${esc(w.name)} it is!</span>`:`<span class="badge" style="background:#c9b8d3">🤝 It's a tie!</span>`}
      <div class="voters"><div><b style="color:${A.color}">${esc(A.name)}</b>${q.a.map(esc).join(", ")||"—"}</div><div><b style="color:${B.color}">${esc(B.name)}</b>${q.b.map(esc).join(", ")||"—"}</div></div>
      <div class="tap">Tap to see who voted</div>
    </article>`;
  });
  html+=`</section><section class="guests"><h2>💌 Our lovely guests (${n})</h2><div class="chips">${
    d.rows.map(r=>`<span class="chip">${esc(r.name)} <span>· ${esc(r.relation)}</span></span>`).join("")}</div></section>`;
  $("content").innerHTML=html;
  document.querySelectorAll(".q").forEach(c=>c.onclick=()=>c.classList.toggle("open"));
}

/* ---------- Presentation ---------- */
let step=0, revealed=false;
function openShow(){ if(!DATA||!DATA.rows.length) return; step=0; revealed=false; $("show").classList.add("on"); drawSlide();
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }
function closeShow(){ $("show").classList.remove("on"); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
function drawSlide(){
  const qs=DATA.qs, st=$("stage");
  st.classList.remove("revealed");
  if(step>=qs.length){ // finale
    const w=DATA.winsA===DATA.winsB?null:(DATA.winsA>DATA.winsB?A:B);
    $("sCount").textContent="FINAL RESULT";
    st.innerHTML=`<div class="final">
      <div class="se">${w?w.emoji:"🤝"}</div>
      <h2 style="margin:2vh 0">${w?`${esc(w.name)} wins the crown! 👑`:"It's a perfect tie!"}</h2>
      <div class="sq" style="font-size:clamp(22px,3vw,40px);margin:0">${esc(A.name)} ${DATA.winsA} – ${DATA.winsB} ${esc(B.name)}</div>
      <p style="margin-top:2vh;color:var(--soft);font-size:clamp(14px,1.8vw,22px)">Thank you to all ${DATA.rows.length} guests for playing 💕</p></div>`;
    $("sHint").textContent="Press Esc or ✕ to exit"; confetti(); return;
  }
  const q=qs[step], t=q.a.length+q.b.length, pa=pct(q.a.length,t), pb=t?100-pa:0;
  const win=q.a.length>q.b.length?"A":q.b.length>q.a.length?"B":"";
  $("sCount").textContent=`QUESTION ${step+1} OF ${qs.length}`;
  $("sHint").textContent=revealed?"Tap / → for next question":"Tap / press → to reveal";
  const p=(k,P,n,per)=>`<div class="pl ${win===k?"winner":""}">
      <div class="pcrown">👑</div>
      <div class="pav" style="background:${P.color}33">${P.emoji}</div>
      <div class="pnm">${esc(P.name)}</div>
      <div class="pct" style="color:${P.color}">${per}%</div>
      <div class="pv">${n} vote${n===1?"":"s"}</div>
      <div class="pbar"><i style="background:${P.color}" data-w="${per}"></i></div></div>`;
  st.innerHTML=`<div class="se">${q.emoji}</div><div class="sq">${esc(q.text)}</div>
    <div class="duel">${p("A",A,q.a.length,pa)}${p("B",B,q.b.length,pb)}</div>`;
}
function reveal(){
  const st=$("stage"); st.classList.add("revealed"); revealed=true;
  st.querySelectorAll(".pbar i").forEach(i=>i.style.width=i.dataset.w+"%");
  $("sHint").textContent="Tap / → for next question";
  setTimeout(()=>confetti(12),900);
}
function next(){ if(step>=DATA.qs.length) return; if(!revealed){reveal();} else {step++;revealed=false;drawSlide();} }
function prev(){ if(step>0){step--;revealed=false;drawSlide();} }
$("show").addEventListener("click",e=>{ if(e.target.id!=="closeShow") next(); });
$("closeShow").onclick=e=>{e.stopPropagation();closeShow();};
document.addEventListener("keydown",e=>{ if(!$("show").classList.contains("on")) return;
  if(["ArrowRight"," ","Enter","PageDown"].includes(e.key)){e.preventDefault();next();}
  else if(["ArrowLeft","PageUp"].includes(e.key)) prev(); else if(e.key==="Escape") closeShow(); });
$("presentBtn").onclick=openShow; $("refreshBtn").onclick=load;

function confetti(n=45){const set=["🎉","🎊","💗","💙","⭐","🍼","🎈"];
  for(let i=0;i<n;i++){const c=document.createElement("span");c.className="confetti";c.textContent=set[i%set.length];
    c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2+Math.random()*2.5)+"s";c.style.animationDelay=Math.random()*.6+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),5200);}}

function demoData(){
  const qs=["Who will take more baby pictures?","Who will change the most diapers?","Who will be the fun parent?","Who will sleep in Kumbhakaran mode?","Who will panic at the first sneeze?","Who will rely on dadi's/nani's nuskhas?","Who will say \"Ek hi bacha kaafi hai\"?","Who will need chai/coffee at 3 AM?","Who will spoil the baby most?","Who can sing better lullabies?","Who will blame the nazar for crying?","Who will be the stricter Hitler parent?","Who will be up with the baby at night?"];
  const headers=["timestamp","name","relation",...qs.map((q,i)=>`Q${i+1}. ${q}`)];
  const ppl=[["Priya Verma","Mausi"],["Rohit","Chacha"],["Sunita","Dadi"],["Kavya","Friend"],["Amit","Mama"],["Pooja","Bua"],["Rahul","Cousin"]];
  const rows=ppl.map(([name,relation],k)=>{const r={timestamp:new Date().toISOString(),name,relation};
    qs.forEach((q,i)=>r[`Q${i+1}. ${q}`]=((i*7+k*3)%5<3)?A.name:B.name);return r;});
  return {headers,rows};
}

load(); setInterval(()=>{ if(!$("show").classList.contains("on")) load(); }, CONFIG.REFRESH_SECONDS*1000);
</script>
</body>
</html>
